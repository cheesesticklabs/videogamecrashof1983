<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light dark"><title>Cheesestick Labs · The Video Game Crash of 1983</title><link rel="stylesheet" href="template.css"><link rel="stylesheet" href="lesson.css"><link rel="stylesheet" href="outline.css"></head><body>
<a href="#lesson" class="skip" id="skip">Skip to lesson</a>
<div class="app-shell">
<header class="topbar"><div class="brand"><div class="logo"><img src="assets/oz.png" alt="Oz wearing spiral glasses" width="1536" height="1536"></div><div class="brand-text"><div class="brandline"><img class="wordmark" src="assets/wordmark.png" alt="Cheesestick Labs" width="1131" height="130"></div><div class="series" id="series"></div><h1 id="lesson-title"></h1><div class="subtitle" id="subtitle"></div></div></div><div class="header-tools"><div class="utilities"><button id="language" class="language">Español</button><button id="theme" class="theme"><span class="theme-track"><span class="theme-thumb">☀</span></span><span id="theme-label">Light</span></button><button id="help" class="help">? Help</button></div></div></header>
<div class="nav-wrap"><div class="lesson-map-scroll"><nav id="page-nav" aria-label="Lesson pages"></nav></div><div class="session-line"><span class="draft" id="draft-status" role="status"></span><button class="teacher-link" id="teacher-open">Teacher</button></div></div>
<main id="lesson" tabindex="-1"></main>
</div>
<button class="vocab-tab" id="vocab-toggle" aria-controls="vocab-drawer" aria-expanded="false">Vocabulary</button>
<aside id="vocab-drawer" class="vocab-drawer" hidden><div class="drawer-heading"><h2 id="vocab-heading">Vocabulary</h2><button class="icon-button" data-close-vocab aria-label="Close">×</button></div><dl id="vocab-list"></dl></aside>
<dialog id="checkpoint" aria-labelledby="checkpoint-question"><form id="checkpoint-form"><div class="dialog-top"><span class="eyebrow" id="checkpoint-label"></span><button type="button" class="icon-button" data-close="checkpoint" aria-label="Close">×</button></div><span class="dialog-symbol">✦</span><h2 id="checkpoint-question"></h2><p id="checkpoint-hint" class="muted"></p><label for="checkpoint-answer" id="checkpoint-answer-label"></label><div class="unlock-row"><input id="checkpoint-answer" type="text" autocomplete="off" required><button class="primary" id="unlock-button"></button></div><p id="checkpoint-status" role="status"></p></form></dialog>
<dialog id="help-dialog"><div class="dialog-top"><h2 id="help-title"></h2><button class="icon-button" data-close="help-dialog" aria-label="Close">×</button></div><div id="help-content"></div></dialog>
<dialog id="choice-dialog"><form id="choice-form"><h2 id="choice-title"></h2><p id="choice-warning"></p><div class="help-actions"><button type="button" class="secondary" data-close="choice-dialog" id="choice-cancel"></button><button class="primary" id="choice-confirm"></button></div></form></dialog>
<dialog id="game-dialog" aria-labelledby="game-title"><div class="game-window"><div class="window-header"><h2 id="game-title"></h2><button id="close-game" aria-label="Close game and return to lesson">×</button></div><iframe id="game-frame" title="Atari game player" allow="autoplay" src="about:blank"></iframe></div></dialog>
<dialog id="teacher-dialog"><div class="dialog-top"><h2>Teacher setup</h2><button class="icon-button" data-close="teacher-dialog" aria-label="Close">×</button></div><div id="teacher-content"></div></dialog>
<div class="toast" id="toast" role="status" hidden></div><div id="print-area"></div>
<script src="config.js"></script><script src="content.js"></script><script src="passwords.js"></script><script src="lesson-sections.js"></script><script src="submission.js"></script><script src="jspdf.umd.min.js"></script><script src="answer-pdf.js"></script><script src="app.js"></script>
</body></html>
